name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Type-check SDK and examples
        run: pnpm exec tsc -b packages/sdk examples/frontend-vanilla examples/frontend-react --pretty false

      - name: Lint and format check
        run: pnpm lint

      - name: Check public OpenAPI artifact
        run: pnpm openapi:check

      - name: Check generated SDK types
        run: pnpm sdk:check

      - name: Check e-commerce demo artifacts
        run: pnpm demo:ecommerce:openapi:check && pnpm demo:ecommerce:client:check

      - name: Test
        run: pnpm test

      - name: Contract tests
        run: pnpm test:contract

      - name: Dependency audit
        run: pnpm audit --audit-level=high

  demo-ecommerce-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @skeletonstructure/demo-ecommerce exec playwright install --with-deps chromium

      - name: E-commerce demo browser happy path
        run: pnpm demo:ecommerce:test:e2e
