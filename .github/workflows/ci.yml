name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Type-check SDK and examples
        run: pnpm exec tsc -b packages/sdk examples/frontend-vanilla examples/frontend-react --pretty false

      - name: Lint and format check
        run: pnpm lint

      - name: Check public OpenAPI artifact
        run: pnpm openapi:check

      - name: Check generated SDK types
        run: pnpm sdk:check

      - name: Check e-commerce demo artifacts
        run: pnpm demo:ecommerce:openapi:check && pnpm demo:ecommerce:client:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Contract tests
        run: pnpm test:contract

      - name: Regression tests
        run: pnpm test:regression

      - name: Database migration CLI smoke test
        run: pnpm test:migration-smoke

      - name: Production demo build
        run: pnpm --filter @skeletonstructure/demo-ecommerce build

      - name: Check config reference drift
        run: pnpm config:docs && git diff --exit-code -- docs/config/reference.md

      - name: Dependency audit
        run: pnpm audit --audit-level=high

  demo-ecommerce-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @skeletonstructure/demo-ecommerce exec playwright install --with-deps chromium

      - name: E-commerce demo browser happy path
        run: pnpm demo:ecommerce:test:e2e
